# ─────────────────────────────────────────────────────────────────────
# Production deploy — Libyan Spider cPanel shared hosting via FTPS
#
# The host's firewall blocks inbound SSH from GitHub runners, so this
# workflow uploads files over FTPS instead. Because FTP cannot execute
# commands, post-deploy tasks (migrate/caches) run through the token-
# protected GET /deploy/run hook on the live site (DeployRunController).
#
# Server layout (matches deploy.md):
#   /home/<user>/app           ← Laravel app root (this repo minus public/)
#   /home/<user>/public_html   ← Laravel public/ (docroot)
#   /home/<user>/.env          ← NEVER touched by deploys (not in git)
# ─────────────────────────────────────────────────────────────────────
name: Deploy production

on:
  push:
    branches: [main]

# Never run two deploys at once; superseded runs are cancelled.
concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # ── 1. Checkout the exact commit being deployed ────────────────
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Full history so the composer.lock guard can diff this push
          # against the previous one.
          fetch-depth: 0

      #    vendor/ is never FTP-deployed (thousands of files at ~4.5s per
      #    FTP command on this host). The server keeps its own vendor/ from
      #    composer, so a changed lockfile must be composer-installed on the
      #    server BEFORE this deploy ships code that depends on it.
      - name: Fail early if composer.lock changed (vendor is not FTP-deployed)
        env:
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            exit 0
          fi
          if git diff --name-only "$BEFORE" "$SHA" | grep -q '^composer\.lock$'; then
            echo "::error::composer.lock changed in this push. SSH into the server, run 'composer install --no-dev --optimize-autoloader' in the app folder, then re-run this deploy."
            exit 1
          fi

      # ── 2. Build stage: production dependencies + compiled assets ──
      - name: Set up PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Install Composer dependencies (no dev)
        run: composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader

      - name: Set up Node 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build Vite assets
        run: npm run build

      # ── 3. Upload application code over FTPS ───────────────────────
      #    Excluded on purpose (server-only or runtime data):
      #    - storage/  → logs, sessions, user uploads live here
      #    - vendor/   → managed by composer ON the server (see guard above)
      #    - public/   → synced separately into the docroot + app tree below
      #    - tests/docs/.git/.github/node_modules → dev-only
      #    NOTE: exclude takes GLOB patterns, not regex — regex patterns
      #    silently match nothing and caused a 90-minute node_modules dump.
      #    "**/.git*" also covers .github; keep that pairing intact.
      - name: FTP deploy application code
        uses: SamKirkland/ftp-deploy-action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          protocol: ftps
          local-dir: ./
          server-dir: ${{ secrets.DEPLOY_PATH }}/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/vendor/**
            **/tests/**
            **/docs/**
            **/storage/**
            **/public/**
            **/.env*
            **/.agents/**
            **/skills/**
            skills-lock.json
            tmp-*
          dangerous-clean-slate: false

      #    Docroot upload: built assets + static files.
      #    Excludes: storage (the storage:link symlink) and .well-known
      #    (ACME/cPanel-managed SSL challenges).
      - name: FTP deploy public directory
        uses: SamKirkland/ftp-deploy-action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          protocol: ftps
          local-dir: ./public/
          server-dir: ${{ secrets.PUBLIC_PATH }}/
          exclude: |
            **/storage/**
            **/.well-known/**
          dangerous-clean-slate: false

      #    App-tree upload: PHP resolves the Vite manifest via public_path()
      #    inside the app root, while the browser fetches the asset files
      #    from the docroot. Both copies need the new build or PHP serves
      #    stale asset hashes. Same excludes as the docroot upload.
      - name: FTP deploy public directory into the app tree
        uses: SamKirkland/ftp-deploy-action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          protocol: ftps
          local-dir: ./public/
          server-dir: ${{ secrets.DEPLOY_PATH }}/public/
          exclude: |
            **/storage/**
            **/.well-known/**
          dangerous-clean-slate: false

      # ── 4. Post-deploy tasks via HTTP hook ─────────────────────────
      #    Runs migrate --force, rebuilds config/route/view caches,
      #    regenerates static SEO files and restarts queue workers.
      #    Authorized by DEPLOY_TOKEN via the X-Deploy-Token header (also
      #    present in server .env). A custom header is required because
      #    shared-hosting PHP handlers strip the Authorization header; the
      #    custom header keeps the token out of access logs the same way.
      - name: Run post-deploy tasks
        run: |
          RESPONSE=$(curl -sf --max-time 300 \
            -H "X-Deploy-Token: ${{ secrets.DEPLOY_TOKEN }}" \
            "https://${{ secrets.SITE_URL }}/deploy/run")
          echo "Hook response: $RESPONSE"
          echo "$RESPONSE" | grep -q '"status":"ok"'

      # ── 5. Smoke test — fail loudly if the site didn't come up ─────
      - name: Smoke test
        run: |
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 https://${{ secrets.SITE_URL }})
          echo "HTTP status: $STATUS"
          test "$STATUS" != "5"

      - name: Notify on failure
        if: failure()
        run: echo "::error::Deploy failed. Re-run the last successful workflow, then hit /deploy/run?token=... manually."
