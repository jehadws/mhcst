; PHP-level output compression fallback.
; The host's Apache has neither mod_brotli nor mod_deflate (verified via
; missing Content-Encoding response header), so HTML/JSON responses are
; compressed here at the PHP layer instead.
; Note: this only covers PHP-generated responses (HTML, /site.webmanifest).
; Static /build/assets files need mod_deflate or Cloudflare edge caching.
zlib.output_compression = On
zlib.output_compression_level = 6
